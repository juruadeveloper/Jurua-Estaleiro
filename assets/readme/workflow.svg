<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="460" viewBox="0 0 1200 460"
     role="img" aria-labelledby="wfTitle wfDesc">
  <title id="wfTitle">Do aço ao comboio em operação</title>
  <desc id="wfDesc">Quatro etapas do processo: aço processado, construção naval, telemetria embarcada e rota hidrográfica, com ajuste sazonal de calado entre cheia e seca.</desc>

  <defs>
    <linearGradient id="wfNavy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A2540"/>
      <stop offset="1" stop-color="#0E1E38"/>
    </linearGradient>
    <clipPath id="wfClip">
      <rect width="1200" height="460" rx="26"/>
    </clipPath>
  </defs>

  <g clip-path="url(#wfClip)">
    <rect width="1200" height="460" fill="url(#wfNavy)"/>

    <text x="64" y="58" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="18" letter-spacing="3" fill="#F26522">COMO OPERAMOS</text>
    <text x="64" y="106" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">Do aço ao comboio em operação</text>

    <line x1="64" y1="148" x2="1136" y2="148" stroke="#4A5568" stroke-width="2"/>

    <!-- 01 aço -->
    <g transform="translate(64 0)">
      <rect x="0" y="172" width="253" height="172" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#4A5568" stroke-width="1.5"/>
      <g transform="translate(24 190)">
        <rect x="0" y="0" width="86" height="12" rx="3" fill="#F26522"/>
        <rect x="0" y="18" width="86" height="12" rx="3" fill="#F26522" opacity="0.62"/>
        <rect x="0" y="36" width="56" height="12" rx="3" fill="#F26522" opacity="0.32"/>
      </g>
      <text x="24" y="288" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Aço</text>
      <text x="24" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#E9ECEF" opacity="0.66">30 mil t/ano</text>
      <text x="24" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#E9ECEF" opacity="0.66">corte a plasma + blast</text>
    </g>

    <!-- 02 construção -->
    <g transform="translate(337 0)">
      <rect x="0" y="172" width="253" height="172" rx="14" fill="#FFFFFF" fill-opacity="0.03" stroke="#4A5568" stroke-width="1.5"/>
      <g transform="translate(24 196)">
        <rect x="0" y="14" width="96" height="26" rx="4" fill="#E9ECEF"/>
        <rect x="104" y="4" width="36" height="36" rx="6" fill="#F26522"/>
        <rect x="116" y="-6" width="5" height="10" fill="#FFFFFF"/>
      </g>
      <text x="24" y="288" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Construção</text>
      <text x="24" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#E9ECEF" opacity="0.66">balsas e empurradores</text>
      <text x="24" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#E9ECEF" opacity="0.66">terminais · fundeio</text>
    </g>

    <!-- 03 telemetria -->
    <g transform="translate(610 0)">
      <rect x="0" y="172" width="253" height="172" rx="14" fill="#F26522" fill-opacity="0.07" stroke="#F26522" stroke-opacity="0.55" stroke-width="1.5"/>
      <g transform="translate(24 194)">
        <path d="M6 50 L 40 30 L 64 40 L 104 8" fill="none" stroke="#F26522" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="104" cy="8" r="6" fill="#F26522"/>
        <circle cx="6" cy="50" r="5" fill="#E9ECEF"/>
      </g>
      <text x="24" y="288" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Telemetria</text>
      <text x="24" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#E9ECEF" opacity="0.66">IoT embarcado · MQTT</text>
      <text x="24" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#E9ECEF" opacity="0.66">motor · combustível</text>
    </g>

    <!-- 04 rota -->
    <g transform="translate(883 0)">
      <rect x="0" y="172" width="253" height="172" rx="14" fill="#4A5568" fill-opacity="0.16" stroke="#4A5568" stroke-width="1.5"/>
      <g transform="translate(24 196)">
        <path d="M0 26 C 30 8, 74 42, 110 22 S 160 6, 200 12" fill="none" stroke="#F26522" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>
        <circle cx="0" cy="26" r="5" fill="#F26522"/>
        <circle cx="200" cy="12" r="5" fill="#FFFFFF"/>
      </g>
      <text x="24" y="288" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#FFFFFF">Rota</text>
      <text x="24" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#E9ECEF" opacity="0.66">GIS · PostGIS · QGIS</text>
      <text x="24" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="18" fill="#E9ECEF" opacity="0.66">calado · comboio</text>
    </g>

    <!-- number badges on the connector -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" font-weight="700" text-anchor="middle">
      <circle cx="88" cy="148" r="15" fill="#F26522"/><text x="88" y="154" fill="#0A2540">1</text>
      <circle cx="361" cy="148" r="15" fill="#F26522"/><text x="361" y="154" fill="#0A2540">2</text>
      <circle cx="634" cy="148" r="15" fill="#F26522"/><text x="634" y="154" fill="#0A2540">3</text>
      <circle cx="907" cy="148" r="15" fill="#4A5568"/><text x="907" y="154" fill="#FFFFFF">4</text>
    </g>

    <!-- seasonal strip -->
    <text x="64" y="390" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="17" letter-spacing="1.4" fill="#E9ECEF" opacity="0.55">AJUSTE SAZONAL DO CALADO</text>
    <g transform="translate(64 402)">
      <rect width="528" height="42" rx="21" fill="#4A5568" fill-opacity="0.28"/>
      <circle cx="24" cy="21" r="7" fill="#E9ECEF"/>
      <text x="42" y="28" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" fill="#FFFFFF">cheia: calado máximo, comboios maiores</text>
      <g transform="translate(544 0)">
        <rect width="528" height="42" rx="21" fill="#F26522" fill-opacity="0.18"/>
        <circle cx="24" cy="21" r="7" fill="#F26522"/>
        <text x="42" y="28" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="19" fill="#FFFFFF">seca: calado restrito, rotas recalculadas</text>
      </g>
    </g>
  </g>
</svg>
